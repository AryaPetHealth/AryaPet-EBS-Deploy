[project]
name = "arya-backend"
version = "0.1.0"
description = "Backend API for the Arya pet health app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "boto3>=1.35",
    # Self-hosted document classification/extraction (app/services/document_classifier.py).
    # CPU-only torch - the worker has no GPU. See the InstanceType note in
    # .ebextensions/environment.config for the RAM this requires.
    "transformers>=4.44",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI's Depends() default-argument pattern is idiomatic and intentional.
ignore = ["B008"]
