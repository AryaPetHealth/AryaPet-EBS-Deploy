name: Deploy to Elastic Beanstalk (dev)

# Auto-deploys once CI has passed on main. workflow_dispatch is kept as a manual
# fallback (e.g. re-deploying the current main commit without a new push).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: arya-ebstalk-dev-env
  EB_ENVIRONMENT_NAME: arya-ebstalk-dev-env

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Debug - print OIDC token claims
        # Temporary: prints exactly what identity GitHub is presenting to AWS (sub, aud,
        # repository, ref, event_name), so a role-assumption failure can be diagnosed from
        # ground truth instead of guessing at the trust policy. Remove once deploys work.
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "
          import sys, json, base64
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({k: claims[k] for k in ('sub', 'aud', 'repository', 'ref', 'event_name') if k in claims}, indent=2))
          " "$IDTOKEN"

      - name: Debug - print role ARN secret is non-empty and its shape
        run: |
          ARN="${{ secrets.AWS_EB_DEPLOY_ROLE_ARN }}"
          if [ -z "$ARN" ]; then
            echo "::error::AWS_EB_DEPLOY_ROLE_ARN secret is empty or unset"
            exit 1
          fi
          echo "Role ARN length: ${#ARN}"
          echo "Role ARN pattern: $(echo "$ARN" | sed -E 's#^(arn:aws:iam::[0-9]+:role/).*#\1<role-name>#')"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy version label
        id: version
        run: echo "label=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Package source bundle
        run: |
          zip -r deploy.zip . \
            -x ".git/*" ".github/*" ".venv/*" "**/__pycache__/*" \
               "tests/*" ".pytest_cache/*" ".ruff_cache/*"

      - name: Resolve EB's default S3 bucket
        id: eb_bucket
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location --query 'S3Bucket' --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Upload source bundle
        run: |
          aws s3 cp deploy.zip \
            "s3://${{ steps.eb_bucket.outputs.bucket }}/${EB_APPLICATION_NAME}/${{ steps.version.outputs.label }}.zip"

      - name: Create application version
        # Idempotent: re-running for a commit whose version already exists (e.g. a manual
        # re-dispatch after a later step failed) would otherwise fail with "Application
        # Version ... already exists".
        run: |
          VERSION_LABEL="${{ steps.version.outputs.label }}"
          EXISTING=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-labels "$VERSION_LABEL" \
            --query "ApplicationVersions[0].VersionLabel" --output text)

          if [ "$EXISTING" = "$VERSION_LABEL" ]; then
            echo "Application version $VERSION_LABEL already exists, skipping creation."
          else
            aws elasticbeanstalk create-application-version \
              --application-name "${EB_APPLICATION_NAME}" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="${{ steps.eb_bucket.outputs.bucket }}",S3Key="${EB_APPLICATION_NAME}/$VERSION_LABEL.zip" \
              --region "${AWS_REGION}"
          fi

      - name: Deploy application version
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${{ steps.version.outputs.label }}" \
            --region "${AWS_REGION}"

      - name: Wait for environment update to finish
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}"

      - name: Verify environment health
        run: |
          STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Environments[0].Health' --output text)
          echo "Environment health: $STATUS"
          if [ "$STATUS" != "Green" ] && [ "$STATUS" != "Ok" ]; then
            echo "::error::Environment health is $STATUS after deploy"
            exit 1
          fi
