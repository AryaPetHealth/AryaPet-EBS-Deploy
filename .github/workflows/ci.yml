name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          # spaCy's model is a separate download from the pip package (see Dockerfile).
          python -m spacy download en_core_web_sm

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
